<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>LocAR.js WebAR Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #000;
      color: #fff;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(10, 15, 25, 0.9);
      z-index: 1000;
      padding: 24px;
      text-align: center;
    }
    #overlay h2 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      color: #00e5ff;
    }
    #overlay p {
      font-size: 0.95rem;
      color: #cbd5e1;
      max-width: 320px;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    #start-btn {
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4);
      transition: transform 0.15s ease;
    }
    #start-btn:active {
      transform: scale(0.96);
    }

    /* HUD Top Bar */
    #hud-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 500;
      pointer-events: none;
      gap: 10px;
    }

    /* Compass Rose Widget */
    #compass-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 8px 12px;
      min-width: 120px;
    }
    #compass-dial {
      width: 76px;
      height: 76px;
      position: relative;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      transition: transform 0.1s ease-out;
    }
    .cardinal-label {
      position: absolute;
      font-weight: bold;
      font-size: 12px;
    }
    .cardinal-n { top: 3px; color: #ff4757; }
    .cardinal-s { bottom: 3px; color: #70a1ff; }
    .cardinal-e { right: 5px; color: #eccc68; }
    .cardinal-w { left: 5px; color: #2ed573; }
    #compass-needle {
      position: absolute;
      width: 4px;
      height: 48px;
      background: linear-gradient(to bottom, #ff4757 50%, #dfe4ea 50%);
      border-radius: 2px;
    }
    #heading-value {
      font-size: 13px;
      font-weight: 700;
      color: #00e5ff;
    }

    /* Telemetry Panel */
    #telemetry-panel {
      flex: 1;
      max-width: 250px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 10px 12px;
      font-size: 11px;
      line-height: 1.45;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .panel-section-title {
      font-weight: bold;
      color: #00e5ff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 2px;
      margin-bottom: 3px;
    }
    .data-row {
      display: flex;
      justify-content: space-between;
    }
    .data-label {
      color: #94a3b8;
    }
    .data-val {
      color: #f8fafc;
      font-weight: 600;
    }

    /* Status Bar at the Bottom */
    #status-bar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      color: #94a3b8;
      z-index: 500;
      pointer-events: none;
      text-align: center;
    }
    #status-text {
      color: #38ef7d;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h2>WebAR Sensor HUD</h2>
    <p>Grant camera, motion sensors, and geolocation to activate the 3D cardinal markers & telemetry.</p>
    <button id="start-btn">Start AR Experience</button>
  </div>

  <!-- HUD Top Bar -->
  <div id="hud-top">
    <!-- Compass Widget -->
    <div id="compass-container">
      <div id="compass-dial">
        <span class="cardinal-label cardinal-n">N</span>
        <span class="cardinal-label cardinal-e">E</span>
        <span class="cardinal-label cardinal-s">S</span>
        <span class="cardinal-label cardinal-w">W</span>
        <div id="compass-needle"></div>
      </div>
      <div id="heading-value">---° --</div>
    </div>

    <!-- Sensor Telemetry Info -->
    <div id="telemetry-panel">
      <div class="panel-section-title">GPS LOCATION</div>
      <div class="data-row"><span class="data-label">LAT:</span><span id="val-lat" class="data-val">--</span></div>
      <div class="data-row"><span class="data-label">LON:</span><span id="val-lon" class="data-val">--</span></div>
      <div class="data-row"><span class="data-label">ACC:</span><span id="val-acc" class="data-val">--</span></div>

      <div class="panel-section-title" style="margin-top: 6px;">ACCELEROMETER (m/s²)</div>
      <div class="data-row"><span class="data-label">X:</span><span id="val-ax" class="data-val">--</span></div>
      <div class="data-row"><span class="data-label">Y:</span><span id="val-ay" class="data-val">--</span></div>
      <div class="data-row"><span class="data-label">Z:</span><span id="val-az" class="data-val">--</span></div>

      <div class="panel-section-title" style="margin-top: 6px;">ORIENTATION (°)</div>
      <div class="data-row"><span class="data-label">ALPHA:</span><span id="val-alpha" class="data-val">--</span></div>
      <div class="data-row"><span class="data-label">BETA:</span><span id="val-beta" class="data-val">--</span></div>
      <div class="data-row"><span class="data-label">GAMMA:</span><span id="val-gamma" class="data-val">--</span></div>
    </div>
  </div>

  <div id="status-bar">
    Status: <span id="status-text">Waiting to start...</span>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
